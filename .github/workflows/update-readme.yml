name: 'Auto Update README'

on:
  schedule:
    # Runs daily at 21:00 UTC (00:00 Madagascar time)
    # A coin flip in src/index.js decides whether commits are pushed that day
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger
    inputs:
      force:
        description: 'Skip the coin flip and always commit'
        type: boolean
        default: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 👤 Configure git author
        run: |
          git config user.name "Elsy CHARLES"
          git config user.email "elsy.s.charles@gmail.com"

      - name: 🎲 Generate README and random commits
        run: node src/index.js --commit ${{ inputs.force && '--force' || '' }}

      - name: 🚀 Push commits
        run: |
          COUNT=$(git rev-list --count origin/main..HEAD)
          if [ "$COUNT" -gt 0 ]; then
            git push
            echo "✅ Pushed $COUNT commits"
          else
            echo "ℹ️ Nothing to push today"
          fi
